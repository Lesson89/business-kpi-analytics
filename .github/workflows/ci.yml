name: CI - Validate Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -d sql
          test -d data
          test -d docs
          test -d powerbi
          test -f README.md

      - name: Check SQL files exist
        run: |
          find sql -name "*.sql" -type f

      - name: Check SQL files for common issues
        run: |
          echo "Checking SQL files..."

          files=$(find sql -name "*.sql" -type f)

          if [ -z "$files" ]; then
            echo "ERROR: No SQL files found."
            exit 1
          fi

          for file in $files; do
            echo "Checking: $file"

            if grep -qi "DROP DATABASE" "$file"; then
              echo "ERROR: Dangerous DROP DATABASE statement found in $file"
              exit 1
            fi

            if grep -qi "TRUNCATE TABLE" "$file"; then
              echo "WARNING: TRUNCATE TABLE found in $file"
            fi
          done
          echo "SQL quality checks completed."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run customer data quality tests
        run: |
          pytest tests/test_customers.py -v

